name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version_note:
        description: "Optional note for the release run"
        required: false
      bump:
        description: "Version bump type (patch, minor, major)"
        required: false
        default: "patch"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bump version
        run: npm version "${{ inputs.bump }}" --no-git-tag-version

      - name: Build library
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
